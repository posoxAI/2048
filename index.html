<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>2048</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@500;700;800&family=Rubik:wght@400;500;600&display=swap">
<style>
  /* Layout: one square board under a two-number scoreboard. Tiles run cold to hot like a heat map as they double,
     and each one carries its power of two in the corner. A monospaced face for every number. */
  :root {
    --bg: #EEF0F2;
    --ink: #17191C;
    --muted: #5D646C;
    --line: #CBD0D6;
    --accent: #2F7FC1;
    --on-accent: #FFFFFF;
    --board: #D9DEE4;
    --slot: #E8ECF0;
    --t2: #F7F9FB;   --i2: #2A3440;
    --t4: #D6E6F5;   --i4: #1E3A55;
    --t8: #A9CCEB;   --i8: #163650;
    --t16: #6DA9DB;  --i16: #0D2438;
    --t32: #3483C4;  --i32: #FFFFFF;
    --t64: #1E9A8C;  --i64: #FFFFFF;
    --t128: #48B35A; --i128: #FFFFFF;
    --t256: #B5C537; --i256: #26300A;
    --t512: #F0BE2C; --i512: #3A2A00;
    --t1024: #F08A26; --i1024: #FFFFFF;
    --t2048: #E2452E; --i2048: #FFFFFF;
    --t4096: #AE2479; --i4096: #FFFFFF;
    --tbig: #57208C; --ibig: #FFFFFF;
    --plate: rgba(238, 240, 242, 0.88);
    --display: "Martian Mono", "JetBrains Mono", ui-monospace, "Courier New", monospace;
    --body: "Rubik", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111316;
      --ink: #E9ECEF;
      --muted: #98A0A8;
      --line: #2A2F35;
      --accent: #5AA6E6;
      --on-accent: #06192A;
      --board: #1D2126;
      --slot: #262B31;
      --t2: #33404D;   --i2: #DCE6EF;
      --t4: #2D4D6B;   --i4: #E1EEFA;
      --t8: #2F6596;   --i8: #FFFFFF;
      --t16: #3784C4;  --i16: #FFFFFF;
      --t32: #3FA0E0;  --i32: #06192A;
      --t64: #28B3A2;  --i64: #04201C;
      --t128: #5BC86C; --i128: #06210B;
      --t256: #C5D446; --i256: #222A05;
      --t512: #F5C83D; --i512: #2E2200;
      --t1024: #F59A3A; --i1024: #2A1500;
      --t2048: #F05A42; --i2048: #FFFFFF;
      --t4096: #D0378F; --i4096: #FFFFFF;
      --tbig: #8B4BD0; --ibig: #FFFFFF;
      --plate: rgba(17, 19, 22, 0.86);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111316;
    --ink: #E9ECEF;
    --muted: #98A0A8;
    --line: #2A2F35;
    --accent: #5AA6E6;
    --on-accent: #06192A;
    --board: #1D2126;
    --slot: #262B31;
    --t2: #33404D;   --i2: #DCE6EF;
    --t4: #2D4D6B;   --i4: #E1EEFA;
    --t8: #2F6596;   --i8: #FFFFFF;
    --t16: #3784C4;  --i16: #FFFFFF;
    --t32: #3FA0E0;  --i32: #06192A;
    --t64: #28B3A2;  --i64: #04201C;
    --t128: #5BC86C; --i128: #06210B;
    --t256: #C5D446; --i256: #222A05;
    --t512: #F5C83D; --i512: #2E2200;
    --t1024: #F59A3A; --i1024: #2A1500;
    --t2048: #F05A42; --i2048: #FFFFFF;
    --t4096: #D0378F; --i4096: #FFFFFF;
    --tbig: #8B4BD0; --ibig: #FFFFFF;
    --plate: rgba(17, 19, 22, 0.86);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 14px 22px;
  }
  .app {
    width: min(100%, 470px, max(280px, calc(100vh - 250px)));
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 58px); line-height: 0.9; letter-spacing: -0.04em; }
  .scores { display: flex; gap: 8px; }
  .score {
    position: relative;
    min-width: 76px;
    padding: 6px 10px 7px;
    border-radius: 6px;
    background: var(--board);
    text-align: center;
  }
  .score-l { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .score-n { display: block; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .gain {
    position: absolute; left: 0; right: 0; top: 4px;
    font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--accent);
    pointer-events: none; opacity: 0;
  }
  .gain.show { animation: rise 0.7s ease-out; }
  @keyframes rise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-26px); } }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; }
  .btn { background: none; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; font-weight: 500; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { color: var(--muted); cursor: default; opacity: 0.6; }
  .btn:disabled:hover { border-color: var(--line); }
  .btn.armed, .btn.primary { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .bar .group { display: flex; gap: 8px; }

  /* the board is its own size reference: every length inside is a share of its width (cqw) */
  .board {
    position: relative;
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 10px;
    background: var(--board);
    container-type: inline-size;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .board:focus { outline: none; }
  .board.kb:focus { outline: 2px solid var(--accent); outline-offset: 3px; }
  .slots, .tiles { position: absolute; inset: 2.6cqw; --gapx: 2.6cqw; }
  .slot, .tile {
    position: absolute; left: 0; top: 0;
    width: calc((100% - 3 * var(--gapx)) / 4);
    height: calc((100% - 3 * var(--gapx)) / 4);
    border-radius: 6px;
  }
  .slot { background: var(--slot); transform: translate(calc(var(--c) * (100% + var(--gapx))), calc(var(--r) * (100% + var(--gapx)))); }
  .tile {
    transform: translate(calc(var(--c) * (100% + var(--gapx))), calc(var(--r) * (100% + var(--gapx))));
    transition: transform 0.11s ease-in-out;
    z-index: 1;
  }
  .tile .face {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    border-radius: 6px;
    font-family: var(--display); font-weight: 800; letter-spacing: -0.05em;
    font-size: 9.6cqw; line-height: 1;
    background: var(--tc); color: var(--ic);
  }
  .tile .pow { position: absolute; right: 7%; bottom: 7%; font-size: 2.6cqw; font-weight: 500; letter-spacing: 0; line-height: 1; opacity: 0.72; }
  .tile .pow sup { font-size: 0.75em; vertical-align: 0.55em; line-height: 0; }
  .tile.d3 .face { font-size: 8cqw; }
  .tile.d4 .face { font-size: 6.4cqw; }
  .tile.d5 .face { font-size: 5.1cqw; }
  .tile.new .face { animation: appear 0.16s ease-out 0.09s backwards; }
  .tile.merged { z-index: 2; }
  .tile.merged .face { animation: pop 0.18s ease-out 0.09s backwards; }
  @keyframes appear { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(0.85); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile.new .face, .tile.merged .face, .gain.show { animation: none; }
  }

  .over {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 16px;
    border-radius: 10px;
    background: var(--plate);
    text-align: center;
  }
  .over-t { margin: 0; font-family: var(--display); font-weight: 800; font-size: 9cqw; line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
  .over-s { margin: 0; color: var(--muted); }
  .over .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .status { margin: 0; min-height: 1.45em; font-weight: 500; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); background: none; border: 0; padding: 5px 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); }
  .seg button:focus-visible { outline-offset: -2px; }
  .note { margin: 0; color: var(--muted); font-size: 14px; }
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><span class="score-l" id="scoreL">Счёт</span><span class="score-n" id="score">0</span><span class="gain" id="gain"></span></div>
      <div class="score"><span class="score-l" id="bestL">Рекорд</span><span class="score-n" id="best">0</span></div>
    </div>
  </div>

  <div class="bar">
    <div class="group">
      <button class="btn" id="newGame" type="button">Новая игра</button>
      <button class="btn" id="undo" type="button">Отменить ход</button>
    </div>
    <div class="group">
      <button class="btn" id="sound" type="button" aria-pressed="true">Звук: вкл</button>
      <span class="seg" role="group" aria-label="Язык / Language">
        <button type="button" id="langRu" aria-pressed="true">RU</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </span>
    </div>
  </div>

  <div class="board" id="board" tabindex="0" role="application" aria-label="Поле">
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="over" id="over" hidden>
      <p class="over-t" id="overT"></p>
      <p class="over-s" id="overS"></p>
      <div class="row">
        <button class="btn primary" id="overMain" type="button"></button>
        <button class="btn" id="overAlt" type="button"></button>
      </div>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <p class="note" id="note"></p>
</div>

<script>
(function () {
  'use strict';

  var N = 4, GOAL = 2048;
  var $ = function (id) { return document.getElementById(id); };
  var elBoard = $('board'), elTiles = $('tiles'), elStatus = $('status');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- storage (optional) ---------- */
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* storage is optional */ }
  }

  /* ---------- language ---------- */
  var STR = {
    ru: {
      score: 'Счёт', best: 'Рекорд', newGame: 'Новая игра', undo: 'Отменить ход', soundOn: 'Звук: вкл', soundOff: 'Звук: выкл',
      board: 'Поле 4 на 4. Стрелки сдвигают плитки, U отменяет ход',
      start: 'Сдвигайте плитки стрелками или свайпами. Одинаковые числа сливаются.',
      moved: 'Плюс {n}.', stuck: 'В эту сторону ничего не сдвигается.', undone: 'Ход отменён.',
      winT: '2048!', winS: 'Вы собрали 2048. Счёт {n}.', keep: 'Играть дальше', again: 'Новая игра',
      overT: 'Ходов нет', overS: 'Счёт {n}. Последний ход можно отменить.', overSBest: 'Счёт {n}, это новый рекорд. Последний ход можно отменить.',
      undoBtn: 'Отменить ход', confirm: 'Счёт {n} сбросится. Нажмите ещё раз, чтобы подтвердить.',
      resumed: 'Партия продолжается, счёт {n}.', tile: 'Самая большая плитка: {n}.',
      note: 'Клавиатура: стрелки или W, A, S, D, U отменяет ход. Телефон и мышь: проведите по полю в нужную сторону. Все плитки сдвигаются до упора, две одинаковые при встрече сливаются в одну с суммой, и сумма прибавляется к счёту. После каждого хода появляется новая плитка, 2 или изредка 4. Цель — собрать 2048, после неё можно играть дальше. Отменить можно один последний ход. Число в углу плитки показывает, какая это степень двойки.'
    },
    en: {
      score: 'Score', best: 'Best', newGame: 'New game', undo: 'Undo', soundOn: 'Sound: on', soundOff: 'Sound: off',
      board: '4 by 4 board. Arrow keys slide the tiles, U undoes a move',
      start: 'Slide the tiles with the arrow keys or a swipe. Equal numbers merge.',
      moved: 'Plus {n}.', stuck: 'Nothing moves that way.', undone: 'Move undone.',
      winT: '2048!', winS: 'You made 2048. Score {n}.', keep: 'Keep going', again: 'New game',
      overT: 'No moves left', overS: 'Score {n}. You can still undo the last move.', overSBest: 'Score {n}, a new best. You can still undo the last move.',
      undoBtn: 'Undo', confirm: 'The score {n} will be reset. Press again to confirm.',
      resumed: 'Your game goes on, score {n}.', tile: 'The biggest tile: {n}.',
      note: 'Keyboard: arrow keys or W, A, S, D, U undoes a move. Phone and mouse: swipe on the board the way to go. Every tile slides as far as it can; two equal tiles that meet merge into one with their sum, and the sum is added to the score. After every move a new tile appears, a 2 or now and then a 4. The goal is 2048, and you can keep going after it. One last move can be undone. The small number in a tile’s corner is its power of two.'
    }
  };
  // a saved choice wins; otherwise Russian for anyone who lists it among their browser languages
  function pickLang() {
    var saved = load('g2048-lang', '');
    if (saved === 'ru' || saved === 'en') return saved;
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var k = 0; k < list.length; k++) if (String(list[k]).toLowerCase().indexOf('ru') === 0) return 'ru';
    return 'en';
  }
  var lang = pickLang();
  function tr(key, params) {
    var text = STR[lang][key];
    if (params) for (var k in params) text = text.split('{' + k + '}').join(params[k]);
    return text;
  }
  var lastSay = ['start', null];
  function say(key, params) { lastSay = [key, params || null]; elStatus.textContent = tr(key, params); }

  /* ---------- sound ---------- */
  var actx = null;
  var soundOn = load('g2048-sound', '1') === '1';
  function tone(freq, dur, gain, delay) {
    if (!soundOn) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = actx || new AC();
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* sound is optional */ }
  }

  /* ---------- state ---------- */
  var cells = [];           // N*N numbers, 0 for empty
  var score = 0, best = parseInt(load('g2048-best', '0'), 10) || 0, beat = false;
  var won = false, keepPlaying = false, over = false;
  var prev = null;          // the position before the last move, for undo
  var nextId = 1;
  var tiles = {};           // cell index -> { id, v, el }

  function idx(r, c) { return r * N + c; }
  function empties() { var e = []; for (var i = 0; i < N * N; i++) if (!cells[i]) e.push(i); return e; }
  function spawn() {
    var e = empties();
    if (!e.length) return -1;
    var i = e[(Math.random() * e.length) | 0];
    cells[i] = Math.random() < 0.9 ? 2 : 4;
    return i;
  }
  function canMove() {
    if (empties().length) return true;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = cells[idx(r, c)];
      if ((c < N - 1 && cells[idx(r, c + 1)] === v) || (r < N - 1 && cells[idx(r + 1, c)] === v)) return true;
    }
    return false;
  }

  // Slides everything one way. Returns null when nothing moves, otherwise where each tile went and which merged.
  // dir: 0 up, 1 right, 2 down, 3 left
  function slide(dir) {
    var moves = [], merges = [], gained = 0, moved = false;
    var next = cells.slice();
    for (var line = 0; line < N; line++) {
      // the cells of this line, from the edge the tiles move toward
      var path = [];
      for (var k = 0; k < N; k++) {
        var r, c;
        if (dir === 0) { r = k; c = line; }
        else if (dir === 2) { r = N - 1 - k; c = line; }
        else if (dir === 3) { r = line; c = k; }
        else { r = line; c = N - 1 - k; }
        path.push(idx(r, c));
      }
      var out = [], from = [];
      for (k = 0; k < N; k++) {
        var v = cells[path[k]];
        if (!v) continue;
        var last = out.length - 1;
        if (last >= 0 && out[last] === v && !from[last].merged) {
          out[last] = v * 2; gained += v * 2;
          from[last] = { a: from[last].a, b: path[k], merged: true };
        } else {
          out.push(v); from.push({ a: path[k], b: -1, merged: false });
        }
      }
      for (k = 0; k < N; k++) next[path[k]] = k < out.length ? out[k] : 0;
      for (k = 0; k < out.length; k++) {
        var to = path[k];
        if (from[k].a !== to) moved = true;
        moves.push({ from: from[k].a, to: to });
        if (from[k].merged) { moves.push({ from: from[k].b, to: to }); merges.push(to); moved = true; }
      }
    }
    if (!moved) return null;
    return { next: next, moves: moves, merges: merges, gained: gained };
  }

  /* ---------- tiles on screen ---------- */
  function digits(v) { return String(v).length; }
  function colorVar(v) { return v <= 4096 ? String(v) : 'big'; }
  function makeTile(v, i, cls) {
    var el = document.createElement('div');
    var face = document.createElement('div');
    var pow = document.createElement('span');
    face.className = 'face';
    face.textContent = v;
    pow.className = 'pow';
    // the tile as a power of two: 2 with the exponent raised
    var sup = document.createElement('sup');
    sup.textContent = Math.round(Math.log(v) / Math.LN2);
    pow.textContent = '2';
    pow.appendChild(sup);
    face.appendChild(pow);
    el.appendChild(face);
    styleTile(el, v, i, cls);
    elTiles.appendChild(el);
    return { id: nextId++, v: v, el: el };
  }
  function styleTile(el, v, i, cls) {
    el.className = 'tile d' + Math.min(5, Math.max(2, digits(v))) + (cls ? ' ' + cls : '');
    el.style.setProperty('--r', Math.floor(i / N));
    el.style.setProperty('--c', i % N);
    el.style.setProperty('--tc', 'var(--t' + colorVar(v) + ')');
    el.style.setProperty('--ic', 'var(--i' + colorVar(v) + ')');
  }
  function placeTile(t, i) {
    t.el.style.setProperty('--r', Math.floor(i / N));
    t.el.style.setProperty('--c', i % N);
  }
  // draws the board as it is, with no movement
  function renderStill(newAt) {
    elTiles.textContent = '';
    tiles = {};
    for (var i = 0; i < N * N; i++) if (cells[i]) tiles[i] = makeTile(cells[i], i, i === newAt ? 'new' : '');
  }
  // moves the existing tiles, then swaps in merged tiles and the new one
  function renderMove(res, newAt) {
    var old = tiles, fresh = {}, leaving = [];
    res.moves.forEach(function (m) {
      var t = old[m.from];
      if (!t) return;
      placeTile(t, m.to);
      if (res.merges.indexOf(m.to) >= 0) leaving.push(t);
      else fresh[m.to] = t;
    });
    res.merges.forEach(function (i) { fresh[i] = makeTile(cells[i], i, 'merged'); });
    if (newAt >= 0) fresh[newAt] = makeTile(cells[newAt], newAt, 'new');
    // keep classes tidy on tiles that only moved
    Object.keys(fresh).forEach(function (i) {
      var t = fresh[i];
      if (res.merges.indexOf(+i) < 0 && +i !== newAt) t.el.className = t.el.className.replace(/ (new|merged)/g, '');
    });
    tiles = fresh;
    var drop = function () { leaving.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); }); };
    if (reduceMotion) drop(); else setTimeout(drop, 120);
  }

  /* ---------- HUD ---------- */
  function paintScores(gain) {
    $('score').textContent = score;
    $('best').textContent = best;
    if (gain) {
      var g = $('gain');
      g.textContent = '+' + gain;
      g.classList.remove('show'); void g.offsetWidth; g.classList.add('show');
    }
    $('undo').disabled = !prev;
  }
  var overKind = '';
  function showOver(kind) {
    overKind = kind;
    var el = $('over');
    if (!kind) { el.hidden = true; return; }
    el.hidden = false;
    if (kind === 'win') {
      $('overT').textContent = tr('winT');
      $('overS').textContent = tr('winS', { n: score });
      $('overMain').textContent = tr('keep');
      $('overAlt').textContent = tr('again');
    } else {
      $('overT').textContent = tr('overT');
      $('overS').textContent = tr(beat ? 'overSBest' : 'overS', { n: score });
      $('overMain').textContent = tr('again');
      $('overAlt').textContent = tr('undoBtn');
      $('overAlt').hidden = !prev;
    }
    if (kind === 'win') $('overAlt').hidden = false;
  }
  function paintOpts() {
    $('sound').textContent = tr(soundOn ? 'soundOn' : 'soundOff');
    $('sound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }
  function applyLang() {
    document.documentElement.lang = lang;
    $('scoreL').textContent = tr('score'); $('bestL').textContent = tr('best');
    $('newGame').textContent = tr('newGame'); $('undo').textContent = tr('undo');
    elBoard.setAttribute('aria-label', tr('board'));
    $('note').textContent = tr('note');
    $('langRu').setAttribute('aria-pressed', lang === 'ru' ? 'true' : 'false');
    $('langEn').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    disarm(false);
    elStatus.textContent = tr(lastSay[0], lastSay[1]);
    showOver(overKind);
    paintOpts();
  }
  function setLang(v) {
    if (v === lang) return;
    lang = v;
    save('g2048-lang', lang);
    applyLang();
  }

  /* ---------- moves ---------- */
  function biggest() { return Math.max.apply(null, cells); }
  function newGame() {
    cells = []; for (var i = 0; i < N * N; i++) cells.push(0);
    score = 0; beat = false; won = false; keepPlaying = false; over = false; prev = null;
    spawn(); spawn();
    renderStill(-1);
    showOver('');
    say('start');
    paintScores(0); persist();
  }
  function move(dir) {
    if (over || (won && !keepPlaying)) return;
    var res = slide(dir);
    if (!res) { say('stuck'); tone(140, 0.08, 0.03); return; }
    prev = { cells: cells.slice(), score: score, won: won, keepPlaying: keepPlaying, beat: beat };
    cells = res.next;
    score += res.gained;
    if (score > best) { best = score; beat = true; save('g2048-best', best); }
    var at = spawn();
    renderMove(res, at);
    if (res.gained) {
      say('moved', { n: res.gained });
      var top = 0; res.merges.forEach(function (i) { top = Math.max(top, cells[i]); });
      tone(300 + 60 * Math.log(top) / Math.LN2, 0.09, 0.05);
    } else { say('start'); tone(520, 0.03, 0.015); }
    paintScores(res.gained);
    if (!won && biggest() >= GOAL) {
      won = true;
      [523, 659, 784, 1047].forEach(function (f, n) { tone(f, 0.18, 0.06, 0.12 + n * 0.09); });
      setTimeout(function () { if (won && !keepPlaying) showOver('win'); }, reduceMotion ? 0 : 260);
    } else if (!canMove()) {
      over = true;
      tone(220, 0.4, 0.06, 0.1);
      setTimeout(function () { if (over) showOver('lost'); }, reduceMotion ? 0 : 260);
    }
    persist();
  }
  function undo() {
    if (!prev) return;
    cells = prev.cells; score = prev.score; won = prev.won; keepPlaying = prev.keepPlaying; beat = prev.beat;
    prev = null; over = false;
    renderStill(-1);
    showOver('');
    say('undone');
    tone(400, 0.06, 0.03);
    paintScores(0); persist();
  }

  /* ---------- input ---------- */
  function setKb(on) { elBoard.classList.toggle('kb', on); }
  var KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var onButton = e.target && e.target.tagName === 'BUTTON';
    if (KEYS[e.code] !== undefined) {
      if (onButton && e.code.indexOf('Key') === 0) return;
      if (!$('over').hidden) return;
      e.preventDefault(); setKb(true);
      move(KEYS[e.code]);
    } else if ((e.code === 'KeyU' || e.code === 'KeyZ') && !onButton) {
      e.preventDefault(); undo();
    }
  });
  var swipe = null;
  elBoard.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.button !== undefined && e.button !== 0) return;
    setKb(false);
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { elBoard.setPointerCapture(e.pointerId); } catch (err) { /* capture is a convenience */ }
  });
  elBoard.addEventListener('pointerup', function (e) {
    if (!swipe || swipe.id !== e.pointerId) return;
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (!$('over').hidden) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });
  elBoard.addEventListener('pointercancel', function () { swipe = null; });

  /* a game with points asks once before it is thrown away */
  var armed = false, armTimer = 0, sayBefore = null;
  function disarm(restore) {
    if (!armed) return;
    armed = false; $('newGame').classList.remove('armed'); clearTimeout(armTimer);
    if (restore && sayBefore && lastSay[0] === 'confirm') say(sayBefore[0], sayBefore[1]);
    sayBefore = null;
  }
  $('newGame').addEventListener('click', function () {
    if (!over && score > 0 && !armed) {
      armed = true; $('newGame').classList.add('armed');
      if (lastSay[0] !== 'confirm') sayBefore = lastSay;
      say('confirm', { n: score });
      armTimer = setTimeout(function () { disarm(true); }, 3500);
      return;
    }
    disarm(false);
    newGame();
  });
  $('undo').addEventListener('click', undo);
  $('overMain').addEventListener('click', function () {
    if (overKind === 'win') { keepPlaying = true; showOver(''); persist(); elBoard.focus({ preventScroll: true }); }
    else { disarm(false); newGame(); }
  });
  $('overAlt').addEventListener('click', function () {
    if (overKind === 'win') { disarm(false); newGame(); } else undo();
  });
  $('sound').addEventListener('click', function () {
    soundOn = !soundOn; save('g2048-sound', soundOn ? '1' : '0'); paintOpts();
    if (soundOn) tone(660, 0.08, 0.05);
  });
  $('langRu').addEventListener('click', function () { setLang('ru'); });
  $('langEn').addEventListener('click', function () { setLang('en'); });

  /* ---------- persistence ---------- */
  function snapshot() {
    return { cells: cells.slice(), score: score, won: won, keepPlaying: keepPlaying, over: over, beat: beat, prev: prev };
  }
  function persist() { save('g2048-state', JSON.stringify(snapshot())); }
  function okCells(a) {
    return Array.isArray(a) && a.length === N * N && a.every(function (v) { return v === 0 || (v >= 2 && v <= 131072 && (v & (v - 1)) === 0); });
  }
  function restore(d) {
    if (!d || !okCells(d.cells) || !(d.score >= 0) || !d.cells.some(function (v) { return v; })) return false;
    cells = d.cells.slice(); score = Math.floor(d.score);
    won = !!d.won; keepPlaying = !!d.keepPlaying; beat = !!d.beat;
    prev = d.prev && okCells(d.prev.cells) && d.prev.score >= 0 ? { cells: d.prev.cells.slice(), score: Math.floor(d.prev.score), won: !!d.prev.won, keepPlaying: !!d.prev.keepPlaying, beat: !!d.prev.beat } : null;
    over = !canMove();
    renderStill(-1);
    if (won && !keepPlaying) showOver('win'); else if (over) showOver('lost'); else showOver('');
    say('resumed', { n: score });
    return true;
  }

  /* ---------- boot ---------- */
  function boot(data) {
    var slots = $('slots');
    for (var i = 0; i < N * N; i++) {
      var s = document.createElement('div');
      s.className = 'slot';
      s.style.setProperty('--r', Math.floor(i / N));
      s.style.setProperty('--c', i % N);
      slots.appendChild(s);
    }
    if (!data || !data.cells) {
      try { data = JSON.parse(load('g2048-state', 'null')); } catch (e) { data = null; }
    }
    if (!restore(data)) newGame();
    applyLang();
    paintScores(0);
  }

  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(snapshot); } catch (e) { /* no viewer hook */ }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || null);
})();
</script>
